name = "leantls"
version = "0.2.0"
# Libraries only: tools that analyse the default targets (VeriLib's probe-lean) load them into one
# environment, and the two executables both define `main`. Build binaries with
# `lake build tlsget lbrowse`.
defaultTargets = ["LeanTLS", "LeanBrowse"]

# Two libraries in one package: LeanTLS (the TLS 1.3 library) and LeanBrowse (the browser,
# which uses only LeanTLS's public API). `lake build` checks every proof and spec in both.

[[lean_lib]]
name = "LeanTLS"
globs = ["LeanTLS", "LeanTLS.+"]

[[lean_lib]]
name = "LeanBrowse"
globs = ["LeanBrowse", "LeanBrowse.+"]

# HTTPS GET over LeanTLS: tlsget [--insecure] HOST [PATH] [PORT]
[[lean_exe]]
name = "tlsget"
root = "TlsGet"

# Terminal web browser: lbrowse [--dump] [--insecure] [URL]
[[lean_exe]]
name = "lbrowse"
root = "LBrowse"
