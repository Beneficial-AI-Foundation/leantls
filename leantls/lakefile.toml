name = "leantls"
version = "0.1.0"
defaultTargets = ["LeanTLS", "tlsget"]

[[lean_lib]]
name = "LeanTLS"
# LeanTLS.Spec.* hold the specs (RFC vectors + properties) — checked on every build
globs = ["LeanTLS", "LeanTLS.+"]

# tiny CLI: fetch raw bytes from host:443 over TLS 1.3
[[lean_exe]]
name = "tlsget"
root = "Main"
